# Konfiguracja systemu (ConfigAdmin, PID pl.isp.allegro). Wspolna dla wszystkich bundli;
# zmiana pliku przeladowuje konteksty Camela (update-strategy="reload").
# Skladnia ${env:NAZWA:-domyslna} pozwala nadpisac wartosc zmienna srodowiskowa (docker-compose).

# --- Brokery ---
rabbitmq.host = ${env:RABBITMQ_HOST:-localhost}
rabbitmq.port = ${env:RABBITMQ_PORT:-5672}
rabbitmq.username = ${env:RABBITMQ_USER:-guest}
rabbitmq.password = ${env:RABBITMQ_PASSWORD:-guest}
kafka.brokers = ${env:KAFKA_BROKERS:-localhost:9092}
mqtt.host = ${env:MQTT_HOST:-localhost}
mqtt.port = ${env:MQTT_PORT:-1883}

# --- API Allegro (domyslnie mock uruchomiony w tym samym Karafie) ---
allegro.api.url = ${env:ALLEGRO_API_URL:-http://localhost:8090}
allegro.api.token = ${env:ALLEGRO_API_TOKEN:-mock-token}

# --- Harmonogram (cron Quartz; '+' zastepuje spacje) ---
scheduler.cron = ${env:SCHEDULER_CRON:-0/20+*+*+*+*+?}
# pusty = etc/products.json w katalogu Karafa
products.file =

# --- Kolektor / aktualizator: limity i odpornosc ---
collector.throttle.perSecond = 5
updater.throttle.perSecond = 2
http.retry.max = 4
http.retry.delayMs = 500
http.retry.delay429Ms = 2000
# Circuit Breaker: po tylu bledach w oknie konsument kolejki jest wstrzymywany
breaker.failureThreshold = 5
breaker.failureWindowMs = 30000
breaker.halfOpenAfterMs = 15000

# --- Silnik regul ---
pricing.undercutStep = 0.01
pricing.raiseEnabled = true
pricing.minChangePct = 0.5
# zdarzenia starsze niz ten limit sa tylko zapisywane do historii (bez komend i alertow)
pricing.maxEventAgeMs = 60000
alerts.digestIntervalMs = 30000

# --- Mock Allegro ---
mock.port = 8090
mock.error429Rate = ${env:MOCK_ERROR_429_RATE:-0.15}
mock.error500Rate = ${env:MOCK_ERROR_500_RATE:-0.10}
mock.ourSeller = nasz-sklep

# --- Dashboard ---
dashboard.port = 8091
